# Темы из fhnb16/theme-catalog → блок данных index.php.
#
# Сборкой занимается Python из образа раннера (tools/build.py, только
# стандартная библиотека): берёт base.css и themes/*.css из каталога,
# проверяет темы, пересобирает index.php и, если он изменился, коммитит.
# Заодно собирает по index.php на каждую тему (тема закреплена) — zip-архивами
# в артефакт сборки, а на теге v* — в релиз.
#
# Новая тема в каталоге подхватывается раз в сутки, вручную (Run workflow) или
# сразу, если каталог шлёт repository_dispatch с типом themes-updated.

name: themes

on:
  push:
    branches: [master]
    paths:
      - index.php
      - tools/**
      - themes/**
      - .github/workflows/themes.yml
    tags: ['v*']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [themes-updated]

permissions:
  contents: write

concurrency:
  group: themes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Каталог приватный: встроенный токен workflow видит только этот
      # репозиторий. Нужен секрет CATALOG_TOKEN — fine-grained токен с правом
      # Contents: Read-only на fhnb16/theme-catalog. Если каталог станет
      # публичным, секрет не нужен.
      - name: Доступ к каталогу
        env:
          TOKEN: ${{ secrets.CATALOG_TOKEN || github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/fhnb16/theme-catalog)
          if [ "$code" != 200 ]; then
            echo "::error::Нет доступа к fhnb16/theme-catalog (HTTP $code). Каталог приватный — добавьте в Settings → Secrets and variables → Actions секрет CATALOG_TOKEN: fine-grained токен с доступом к theme-catalog и правом Contents: Read-only. Либо сделайте каталог публичным."
            exit 1
          fi

      - name: Каталог тем
        uses: actions/checkout@v4
        with:
          repository: fhnb16/theme-catalog
          path: .catalog
          token: ${{ secrets.CATALOG_TOKEN || github.token }}
          persist-credentials: false

      - name: Сборка
        id: build
        run: |
          python3 tools/build.py \
            --catalog .catalog \
            --rev "$(git -C .catalog rev-parse --short HEAD)" \
            --zip release

      # PHP в образе ubuntu-latest уже есть; если его не окажется, шаг
      # пропускается, а не ставит что-то сверху.
      - name: Проверка страницы и тем
        run: |
          if ! command -v php >/dev/null; then
            echo "::notice::php в образе нет — проверка страницы пропущена"
            exit 0
          fi
          php -l index.php
          mkdir -p /tmp/site/demo && cp index.php /tmp/site/
          echo '<h1>ok</h1>' > /tmp/site/demo/page.html
          php -S 127.0.0.1:8080 -t /tmp/site >/dev/null 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8080/ | grep -q 'demo/page.html'
          curl -fsS 'http://127.0.0.1:8080/?fr=base.css' -o /dev/null -w '%{content_type}\n' | grep -q 'text/css'
          for id in ${{ steps.build.outputs.ids }}; do
            curl -fsS "http://127.0.0.1:8080/?fr=theme.css&id=$id" | grep -q "data-skin=\"$id\""
          done
          echo "ok: страница, каркас и ${{ steps.build.outputs.themes }} тем"

      - name: Коммит index.php
        if: github.ref == 'refs/heads/master' && steps.build.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.php
          git commit -m "themes: каталог $(git -C .catalog rev-parse --short HEAD) (${{ steps.build.outputs.themes }} тем)"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: folderRunner-themes
          path: release/

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
